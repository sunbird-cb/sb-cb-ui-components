<mat-card class="flex flex-col card-container">
    <div class="photo-container flex items-center justify-center mb-4">
        <ng-container *ngIf="hoverUser?.profileBannerUrl; else defaultBanner">
            <img class="banner-image" [src]="hoverUser?.profileBannerUrl" alt="banner pic" />
        </ng-container>
        <ng-template #defaultBanner>
            <img class="banner-image" src="./assets/icons/profile_cover_pic.svg" alt="default banner pic" />
        </ng-template>
        <div class="fixd" i18n-aria-label role="link" aria-label="click on it to visit user profile">
            <sb-uic-avatar-photo [name]="useravatarName" [photoUrl]="hoverUser?.profileImageUrl" size="round-l-s">
            </sb-uic-avatar-photo>
            <span class="profile-badge" *ngIf="hoverUser?.verifiedKarmayogi">  <img class="profile-badge" src="fusion-assets/images/profile-badge.png" height="18" alt="profile-badge">
            </span>
            
        </div>
    </div>
    <mat-card-content class="name-container flex flex-col width-expand">
        <div *ngIf="hoverUser" class="margin-top-xs" i18n-aria-label role="link">
            <div class="mat-title name ws-mat-black-text truncate">
                {{userName}}
            </div>
            <div class="flex flex-column gap-2 justify-s" >
                <span class="designation w-full mat-body-1 ws-mat-black60-text ">
                    {{hoverUser?.designation || hoverUser?.designationOther}}
                </span>
                <div class="designation w-full ws-mat-black60-text ">
                    {{hoverUser?.employmentDetails?.departmentName}}
                </div>
            </div>

            <div class="flex flex-1 flex-column">
                <div class="flex flex-1 m-margin cursor-pointer">
                    <a role="link" class="flex ws-mat-default-text" (click)="goToUserProfile()">
                        <mat-icon>group</mat-icon>
                        <span class="mat-body-2 margin-left-s" >{{'Network Profile'}}</span>
                    </a>
                </div>
            </div>

        </div>
    </mat-card-content>
</mat-card>
