<h2 mat-dialog-title class="dialog-title">{{data ? 'Edit Section Title' : 'Add New Tab'}}</h2>

<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{data ? 'Section Title' : 'Tab Title'}}</mat-label>
    <input matInput [(ngModel)]="tabTitle" (keydown)="onKeydown($event)" placeholder="Enter title" autofocus required
      maxlength="75">
    <mat-hint align="start" *ngIf="data">Enter a descriptive title for the section</mat-hint>
    <mat-hint align="start" *ngIf="!data">Enter a descriptive title for the new tab</mat-hint>
    <mat-hint align="end">{{tabTitle?.length || 0}}/75</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button class="btn-common btn-secondary" (click)="onCancel()">
    Cancel
  </button>
  <button mat-button class="btn-common btn-primary" (click)="onAdd()" [disabled]="!tabTitle || !tabTitle.trim()">
    {{data ? 'Done' : 'Add Tab'}}
  </button>
</mat-dialog-actions>
