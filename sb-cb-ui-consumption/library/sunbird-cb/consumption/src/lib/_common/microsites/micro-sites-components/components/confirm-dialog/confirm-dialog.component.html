<h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>

<mat-dialog-content class="dialog-content">
  <p class="dialog-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button class="btn-common btn-secondary" (click)="onCancel()">
    {{ data.cancelText }}
  </button>
  <button mat-button class="btn-common btn-primary" (click)="onConfirm()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
