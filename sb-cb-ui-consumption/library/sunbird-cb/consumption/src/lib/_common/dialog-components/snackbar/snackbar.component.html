<div class="snackbar-wrapper">
  <div class="flex items-center justify-between">
    <div class="message flex items-center gap-4">
      <mat-icon *ngIf="data?.type === 'success'" class="text-white">check</mat-icon>
      <ng-container *ngIf="data?.type === 'error'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: brightness(0) invert(1)">
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 13C11.45 13 11 12.55 11 12V8C11 7.45 11.45 7 12 7C12.55 7 13 7.45 13 8V12C13 12.55 12.55 13 12 13ZM13 17H11V15H13V17Z"
            fill="#D13924"
          />
        </svg>
      </ng-container>
      <span *ngIf="data?.message" class="text-white">{{ data?.message }}</span>
    </div>
    <div class="close">
      <mat-icon class="cursor-pointer" (click)="snackBarRef.dismiss()" class="text-white">close</mat-icon>
    </div>
  </div>
</div>
