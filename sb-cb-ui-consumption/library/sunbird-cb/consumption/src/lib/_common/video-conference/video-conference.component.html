<div class="video-conference container " *ngIf="videoConf" id="contact_us">
    <div class="content ">
        <img [src]="videoConf?.thumbnail" alt="image" class="image">
        <div class="text-center mb-3">
            <img src="../../../../../assets/icons/call-iicon.svg" alt="">
        </div>
        <h1 class="title">{{videoConf?.title }}</h1>
        <div class="d-flex gap-2 align-items-center justify-content-center">
            <p class="date">{{videoConf?.date }}</p>
            <p class="time">{{videoConf?.time }}</p>
        </div>
        <button *ngIf="videoConf?.button" (click)="joinVideoConference(videoConf.joinLink)">{{videoConf?.button }}</button>
        <p class="text-support">{{videoConf?.technicalSupport }} 
            <span *ngIf="!videoConf?.plsContacts" class="contachEmail">{{videoConf?.plsContact }}</span>
            <a *ngIf="videoConf?.plsContacts" class="contachEmail" href="mailto:{{ videoConf?.plsContacts }}">{{videoConf?.plsContact }}</a>
         </p>
    </div>
</div>
