<div class="content-container px-8 py-8">
  <div class="profile-box">
    <ng-container *ngIf="contentForm">
      <form class="create-user-form padding-remove" [formGroup]="contentForm">
        <div class="input-column">
          <div class="content-header">
            <h1 class="mat-h1">User details</h1>
          </div>
          <div class="input-wrapper margin-top-s">
            <div class="flex flex-row iteams-center justify-between">
              <div class="form_item w-full disable">
                <div class="margin-top-xs mat-full-radius">
                  <span class="mat-subheading-2 margin-remove flex required"
                    i18n="First name|Label which explains the user to enter title">
                    Full Name
                  </span>
                  <mat-form-field appearance="outline">
                    <input matInput #firstName formControlName="firstName" maxlength="150" i18n-placeholder
                      placeholder="Enter full name" [required]="true" />
                  </mat-form-field>
                </div>
              </div>
            </div>
            <div class="flex flex-row iteams-center justify-between">
              <div class="form_item w-full disable">
                <div class="margin-top-xs mat-full-radius">
                  <span class="mat-subheading-2 margin-remove flex required"
                    i18n="Email|Label which explains the user to enter title">
                    Email
                  </span>
                  <mat-form-field appearance="outline">
                    <input matInput #email formControlName="email" maxlength="320" i18n-placeholder
                      placeholder="Enter Email"/>
                  </mat-form-field>
                </div>
                <div class="form_item w-full mat-full-radius">
                  <div class="margin-top-xs">
                    <span class="mat-subheading-2 margin-remove flex required"
                      i18n="Mobile Number|Label which explains the user to enter title">
                      Mobile Number
                    </span>
                    <mat-form-field appearance="outline">
                      <input matInput #mobileNumber formControlName="mobileNumber" maxlength="10" i18n-placeholder
                        placeholder="Enter Mobile Number" [required]="true" />
                    </mat-form-field>
                  </div>
                </div>
              </div>
              <div class="form_item w-full">
                <div class="margin-top-xs mat-full-radius disable">
                  <span class="mat-subheading-2 margin-remove flex required"
                    i18n="Department|Label which explains the user to enter title">
                    Department
                  </span>
                  <mat-form-field appearance="outline">
                    <input matInput #channel formControlName="channel" maxlength="500" i18n-placeholder
                      placeholder="Enter Department" [required]="true"/>
                  </mat-form-field>
                </div>
              </div>
            </div>
          </div>
          <div class="input-wrapper margin-top-s margin-bottom-s">
            <label aria-label="Roles label" class="margin-remove-bottom form-label required" for="roles"> Role
            </label>
            <mat-selection-list class="mat-selection-list mat-list-base" id="roles" #roles role="listbox" tabindex="0"
              aria-disabled="false" formControlName="selectedRoles">
              <mat-list-option class="mat-list-item mat-list-option" *ngFor="let item of listOfRoles" [value]="item">
                {{item}}
              </mat-list-option>
            </mat-selection-list>
          </div>
          <div class="flex flex-middle gap-4">
            <button mat-raised-button class="button-with-corners new-primary-button" type="button"
              (click)="updateuser()" [disabled]="contentForm?.invalid">
              Update</button>
            <button mat-raised-button class="button-with-corners new-secondary-button" type="button"
              (click)="actionBtn()">Cancel</button>
          </div>
        </div>
      </form>
    </ng-container>
  </div>
</div>
