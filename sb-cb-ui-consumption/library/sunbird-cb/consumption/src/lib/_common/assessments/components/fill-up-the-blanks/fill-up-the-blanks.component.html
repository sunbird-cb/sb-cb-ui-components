<div class="ftb-container">
  <div class="ftb-blanks-list" *ngIf="options.length > 0">
    <div class="ftb-blank-item" *ngFor="let option of options; let i = index">
      <div class="blank-serial">
        <span class="serial-text">{{ getRomanNumeral(i + 1) }}.</span>
      </div>

      <div class="blank-input-wrapper">
        <mat-form-field appearance="outline" class="blank-input-field">
          <input matInput [(ngModel)]="option.text" (ngModelChange)="onTextChange(i, $event)" placeholder="Enter answer"
            maxlength="50" [disabled]="isReadOnly" />
        </mat-form-field>
      </div>

      <div class="blank-dropdown-wrapper" *ngIf="!isBasicAssessment()">
        <mat-form-field appearance="outline" class="blank-dropdown-field">
          <mat-select [(ngModel)]="option.blankNumber" (selectionChange)="onBlankSelectionChange(i, option.blankNumber)"
            placeholder="Select Blank" [disabled]="isReadOnly">
            <mat-option *ngFor="let blank of blankList" [value]="blank.id">
              {{ blank.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="blank-actions" *ngIf="options.length > minOptions && !isReadOnly && !isBasicAssessment()">
        <button mat-icon-button (click)="removeOption(i)" matTooltip="Delete this option" class="remove-btn"
          type="button">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
