<div class="w-full h-full c-r-form">
  <sb-uic-horizontal-dynamic-stepper [labels]="steppersList" [selectedIndex]="currentStepperIndex"
    (stepChange)="onStepChanged($event)">
    <ng-template>
      <ng-container *ngIf="!formLoading">
        <sb-uic-create-request-content-details [viewMode]="viewMode"
          [contentDetailsForm]="contentDetailsForm"></sb-uic-create-request-content-details>
      </ng-container>
    </ng-template>
    <ng-template>
      <ng-container *ngIf="!formLoading">
        <sb-uic-create-request-additional-details [viewMode]="viewMode" [demandId]="demandId"
          [additionalDetailsForm]="additionalDetailsForm"></sb-uic-create-request-additional-details>
      </ng-container>
    </ng-template>
  </sb-uic-horizontal-dynamic-stepper>
  <div class="flex justify-between items-center mt-6 mx-4">
    <button mat-raised-button [ngClass]="{'disabled-preview-btn': currentStepperIndex === 0}" class="preview-btn"
      (click)="onPrevious()">
      Previous
    </button>
    <ng-container *ngIf="!(viewMode.toLowerCase() === 'view' && currentStepperIndex === steppersList.length - 1)">
      <button mat-raised-button color="primary" class="submit-btn" (click)="onNext()"
        [ngClass]="{'disabled-preview-btn':
              currentStepperIndex === steppersList.length - 1 && (contentDetailsForm.invalid || additionalDetailsForm.invalid)}">
        {{ currentStepperIndex === steppersList.length - 1 ? 'Submit' : 'Next' }}
      </button>
    </ng-container>
  </div>
</div>
