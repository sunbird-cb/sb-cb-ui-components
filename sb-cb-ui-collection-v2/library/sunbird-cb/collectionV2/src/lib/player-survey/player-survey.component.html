<section #fullScreenContainer class="survey-container" *ngIf="progressStatus < 2 && currentResourceId === resourceId">
  <!-- Commented out due to missing @sunbird-cb/micro-surveys module
  <ng-container *ngIf="wfClientVersion !== '1.1' && !addLoader">
    <lib-micro-survey class="course-survey" [apiData]="apiData" [afterSubmitAction]="afterSubmitAction"
      [isReadOnly]="isReadOnly" [surveyId]="surveyId" [courseId]="courseId" [courseName]="courseName"
      [isblendedprogram]="false"></lib-micro-survey>
  </ng-container>
  -->

  <ng-container *ngIf="wfClientVersion === '1.1' && !addLoader">
    <div class="preview-container w-full">
      <div class="form-header">
        <div class="flex justify-between iteams-center">
          <div>{{formDetails?.title}}</div>
        </div>
      </div>
      <div class="form-content">
        <ng-container *ngIf="surveyForm">
          <form [formGroup]="surveyForm">
            <ng-container *ngFor="let parentField of parentalFields">
              <ng-container [ngSwitch]="parentField.fieldType">
                <ng-container *ngSwitchCase="'heading'">
                  <ws-widget-survey-form-section [childFields]="getChildFields(parentField.sectionId)"
                    [sectionField]="parentField"
                    [childQuestionsFormArray]="getChildQuestionsFormArray(parentField.sectionId)"
                    (questionValues)="updateQuestionValues($event)"></ws-widget-survey-form-section>
                </ng-container>
                <ng-container *ngSwitchCase="'separator'">
                  <hr class="opacity-50 elment-separator">
                </ng-container>
                <ng-container *ngSwitchDefault>
                  <ws-widget-survey-form-question [fieldDetails]="parentField"
                    [questionForm]="getQuestionControl(parentField.controlIndex)"
                    (questionValues)="updateQuestionValues($event)"></ws-widget-survey-form-question>
                </ng-container>
              </ng-container>
            </ng-container>
          </form>
        </ng-container>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="addLoader">
    <div class="w-full text-center my-2 loader flex justify-center items-center">
      <mat-spinner class="inline-block"></mat-spinner>
    </div>
  </ng-container>
</section>

<section #fullScreenContainer class="survey-container" *ngIf="progressStatus === 2 && currentResourceId === resourceId">
  <div>
    <p class="margin-xl mat-subheading-1">{{ 'player.surveySubmitted' | translate }}</p>
  </div>
</section>
