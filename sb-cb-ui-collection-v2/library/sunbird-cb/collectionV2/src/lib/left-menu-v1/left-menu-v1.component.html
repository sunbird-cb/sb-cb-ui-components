<div class="flex flex-1 flex-column min-wid sidenav-wrap">
  <div class="margin-top-xs flex flex-column max-width width-1-1" *ngIf="widgetData.logo">
    <a href="javascript:void(0)" role="link" class="flex flex-column padding-right-m  padding-left-m items-center">
      <div class="dept-logo-block flex flex-middle flex-center">
        <img [src]="widgetData.logoPath" [alt]="widgetData.name" class="img-logo"
          (error)="changeToDefaultImg($event)" />
      </div>
      <span i18n="title" class="mat-subheading-2 margin-top-m  dept-name">
        <!-- this will be dynamic -->
        {{widgetData.name}}
      </span>
    </a>
  </div>
</div>
<mat-accordion [multi]="true">
  <ng-container *ngFor="let menu of widgetData?.menusList; let mi = index">
    <mat-expansion-panel class="menuPannel bg-gray-accordian" *ngIf="isAllowed(menu)" hideToggle="true"
      [expanded]="true" #example>
      <mat-expansion-panel-header>
        <mat-panel-title>
          <mat-panel-description>
            <p class="margin-remove">{{menu?.menuCategory}}</p>
            <mat-icon *ngIf="!example.expanded">arrow_drop_down</mat-icon>
            <mat-icon *ngIf="example.expanded">arrow_drop_up</mat-icon>
          </mat-panel-description>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <mat-nav-list class="nav-list-menu flex-1">
        <ng-container *ngFor="let tab of menu?.subMenu; let i = index">
          <ng-container *ngIf="isAllowed(tab)">
            <a mat-list-item disableRipple class="flex outline-1 menu-item-a" [attr.data-index]="i"
              *ngIf="tab?.enabled && !tab.customRouting && !tab.fragment && !tab.queryParams"
              [routerLink]="[tab.routerLink]" [queryParamsHandling]="preserve" routerLinkActive="ws-active-route-men">
              <!--  [class.ws-active-route-menu]="isLinkActive(tab.key)" [fragment]="tab.fragment? tab.key : ''" [queryParamsHandling]="preserve" -->
              <span class="padding-left-xs">{{tab?.name}}</span>
            </a>
            <a mat-list-item disableRipple class="flex outline-1 menu-item-a" [attr.data-index]="i"
              *ngIf="tab?.enabled && !tab.customRouting && tab.fragment && !tab.queryParams" [routerLink]="'.'"
              [class.ws-active-route-men]="isLinkActive(tab.key, i)" [fragment]="tab.fragment? tab.key : ''"
              [queryParamsHandling]="preserve">
              <span class="padding-left-xs">{{tab?.name}}</span>
            </a>
            <a mat-list-item disableRipple class="flex outline-1 menu-item-a" [attr.data-index]="i"
              *ngIf="tab?.enabled && tab.customRouting && !tab.queryParams" [routerLink]="getLink(tab)"
              [queryParamsHandling]="preserve" routerLinkActive="ws-active-route-men">
              <!--  [class.ws-active-route-menu]="isLinkActive(tab.key)" [fragment]="tab.fragment? tab.key : ''" [queryParamsHandling]="preserve" -->
              <span class="padding-left-xs">{{tab?.name}}</span>
            </a>
            <a mat-list-item disableRipple class="flex outline-1 menu-item-a" [attr.data-index]="i"
              *ngIf="tab?.enabled && !tab.customRouting  && !tab.fragment && tab.queryParams"
              [routerLink]="tab.routerLink" [queryParams]="{'status':tab.queryParams}" [queryParamsHandling]="preserve"
              [class.ws-active-route-men]="isLinkActive2(tab.routerLink)">
              <!-- routerLinkActive="ws-active-route-menu"> -->
              <!--  [class.ws-active-route-menu]="isLinkActive(tab.key)" [fragment]="tab.fragment? tab.key : ''" [queryParamsHandling]="preserve" -->
              <span class="padding-left-xs">{{tab?.name}}</span>
            </a>
          </ng-container>
        </ng-container>
      </mat-nav-list>

    </mat-expansion-panel>
  </ng-container>
</mat-accordion>
