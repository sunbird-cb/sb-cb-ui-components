<div class="flex flex-col items-center" (click)="navigateToDesignation()">
  <div class="flex flex-col bg-white rounded-xxl shadow w-72 px-6 py-6 cursor-pointer card-container">
    <div class="flex flex-col items-center">
      <div class="text-center mb-2 designation-name new-color">{{designation?.name}}</div>
      <div class="text-sm text-center designation-by mb-2">By {{formatAdditionalInfo(designation?.additionalProperties)?.importedByName}}</div>
      <div class="text-xs mb-4 text-center designation-by">On: {{formatAdditionalInfo(designation?.additionalProperties)?.importedOn}}</div>
    </div>
    <div class="flex items-center justify-center mt-auto">
      <button mat-flat-button color="accent" type="button" class="mat-btn-outline cursor-pointer w-full">
        <span class="ws-mat-default-text">View Competencies</span>
      </button>
    </div>
  </div>
</div>
