<div class="container mx-auto ">
   <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
      <!-- Column 1 -->
      <div class=" p-2 rounded-lg md:col-span-3">
         <ng-container *ngIf="!isLoading">
            <d-v2-similar-community-card (communityClick)="onCardClick($event)"
               [expandCard]="!isMobile"></d-v2-similar-community-card>
         </ng-container>
      </div>

      <!-- Column 2 (Double Width on Large Screens) -->
      <div class=" p-2 rounded-lg md:col-span-6">
         <div class="md:col-span-2">
            <div class="flex items-center gap-2 mb-6">
               <div class="relative flex-1 flex community-search" *ngIf="globalSearchEnabled">
                  <input type="text" [value]="searchTextValue" (keydown.enter)="onSearch($event)"
                     placeholder="Search Communities" class="w-full px-4 py-2 pl-10  rounded-full nodtranslate" maxlength="30"/>
                  <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                     search
                  </mat-icon>
               </div>
               <div class="relative flex-1 flex community-search" *ngIf="topicName">
                  <input #searchInput id="searchInput" type="text" [(ngModel)]="localSearchTextValue"
                     placeholder="Search Communities" class="w-full px-4 py-2 pl-10  rounded-full nodtranslate" />
                  <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                     search
                  </mat-icon>
               </div>
               <div class="block md:hidden">
                  <mat-icon (click)="openBottomSheet()">filter_list</mat-icon>
               </div>
            </div>
         </div>
         <div class="px-2 md:px-0 info-text">
            <h2 class="nodtranslate" *ngIf="searchTextValue">Showing results for <span
                  class="higlight-text nodtranslate">"{{searchTextValue}}"</span>
            </h2>
            <h2 class="flex items-center" *ngIf="topicName">
               <mat-icon class="mr-2 cursor-pointer arrow-back-btn nodtranslate"
                  (click)="goBackMethod()">arrow_back_ios</mat-icon>
               <span class="nodtranslate">Communities under <span class="higlight-text">"{{topicName}}"</span>
                  ({{totalCount}})</span>
            </h2>
         </div>
         <ng-container *ngIf="!isLoading">
            <ng-container
               *ngIf="(communityDataList| filterSearch: localSearchTextValue).length;else noDataTemplateCall">
               <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  <div class="flex md:block items-center justify-center"
                     *ngFor="let community of communityDataList | filterSearch: localSearchTextValue">
                     <d-v2-community-card [userJoinedCommunityList]="userJoinedCommunityList" [isLoading]="isLoading"
                        [orgDetails]="orgDetails" [community]="community"
                        (click)="onCardClick(community)"></d-v2-community-card>
                  </div>
               </div>
            </ng-container>
         </ng-container>
         <ng-container *ngIf="isLoading">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
               <div *ngFor="let community of communityDataListLoader">
                  <d-v2-community-card [isLoading]="isLoading" [orgDetails]="orgDetails" [community]="community"
                     (click)="onCardClick(community)"></d-v2-community-card>
               </div>
            </div>
         </ng-container>
         <ng-container *ngIf="!(communityDataList?.length >= totalCount)">
            <div class="load-more-posts my-4 mt-8">
               <button mat-flat-button color="primary" class="w-full nodtranslate" (click)="loadMoreMembers()">Load
                  More</button>
            </div>
         </ng-container>

         <ng-template #noDataTemplateCall>
            <ng-container [ngTemplateOutlet]="noData"
               [ngTemplateOutletContext]="{'iconName':'forum', 'noTextValue':'No Communities found'}"></ng-container>
         </ng-template>

      </div>

      <!-- Column 3 -->
      <div class=" p-2 rounded-lg md:col-span-3">
         <div class="hidden md:block">
            <d-v2-sort-by [sortData]="sortData" (sortOptionSelection)="sortOptionSelection($event)"></d-v2-sort-by>
            <d-v2-filter [filterKeys]="filterKeys" (filterOptionSelected)="selectedFilters($event)"
               [filterObjectList]="filterObjectList"></d-v2-filter>
         </div>
      </div>
   </div>
</div>

<ng-template #noData let-iconName="iconName" let-noTextValue="noTextValue">
   <div class="mt-8">
      <d-v2-no-data [iconName]="iconName" [noText]="noTextValue"></d-v2-no-data>
   </div>
</ng-template>
