<div class="container mx-auto ">
   <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
      <!-- Column 1 -->
      <div class=" p-2 rounded-lg md:col-span-3">
         <d-v2-similar-community-card (communityClick)="onCardClick($event)"></d-v2-similar-community-card>
      </div>

      <!-- Column 2 (Double Width on Large Screens) -->
      <div class=" p-2 rounded-lg md:col-span-6">
         <div class="md:col-span-2">
            <div class="mb-6">
               <div class="relative flex community-search">
                  <input type="text" (keydown.enter)="onSearch($event)" placeholder="Search Communities"
                     class="w-full px-4 py-2 pl-10  rounded-full nodtranslate" />
                  <mat-icon class="absolute left-3 top-1.5 h-5 w-5 text-gray-400">
                     search
                  </mat-icon>
                  <!-- <Search class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" /> -->
               </div>
            </div>
         </div>
         <div class="py-4" *ngIf="topicDataList?.length">
            <div class="flex justify-between items-center mb-4 community-groups">
               <h2 class="text-xl font-medium title margin-remove nodtranslate">All Topics <span class="nodtranslate"
                     *ngIf="topicDataList?.length">({{topicDataList?.length}})</span></h2>
               <a class="show-more flex items-center cursor-pointer nodtranslate" *ngIf="topicDataList?.length > 3"
                  (click)="showAllTopicsMethod()">
                  <span class="nodtranslate">Show all</span>
                  <mat-icon>chevron_right</mat-icon>
               </a>
            </div>
            <!-- <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="!topicDataLoading">
               <div class="">
                  <div *ngFor="let topic of topicDataList | slice:0:3" >
                     <d-v2-topic-card [topicCommunityCount]="topic?.count" [isLoading]="false" (click)="topicCardMethod(topic)"
                         [topicTitle]="topic?.value">
                     </d-v2-topic-card>
                    </div>
               </div>
            </div> -->
            <div class="grid grid-cols-1 md:grid-cols-1 lg:grid-cols-1 gap-4" *ngIf="!topicDataLoading">
               <div class="flex md:block overflow-x-auto scrollbar-hide -mx-2 px-2">
                  <div class="flex md:block space-x-4 md:space-x-7">
                     <div *ngFor="let topic of topicDataList | slice:0:3" class="flex-shrink-0 w-[280px] md:w-auto">
                        <d-v2-topic-card [topicCommunityCount]="topic?.count" [isLoading]="false"
                           (click)="topicCardMethod(topic)" [topicTitle]="topic?.value">
                        </d-v2-topic-card>
                     </div>
                  </div>
               </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="topicDataLoading">
               <d-v2-topic-card [isLoading]="true"></d-v2-topic-card>
               <d-v2-topic-card [isLoading]="true"></d-v2-topic-card>
               <d-v2-topic-card [isLoading]="true"></d-v2-topic-card>
            </div>
         </div>
         <mat-tab-group animationDuration="0ms" class="custom-discuss-home-tab-container " [mat-stretch-tabs]="false"
            mat-align-tabs="start">
            <mat-tab label="Discover">
               <ng-template mat-tab-label> <span class="nodtranslate">Discover</span> <span class="ml-2 nodtranslate"
                     *ngIf="totalCommunitiesCount">({{ totalCommunitiesCount }})</span> </ng-template>
               <ng-template matTabContent>
                  <ng-container *ngIf="topicDataList?.length;else noDataTemplateCall">
                     <d-v2-discover (popularCommunityClick)="popularCommunity($event)" [topicDataList]="topicDataList"
                        (showAllByTopic)="showAllCommunitiesByTopic($event)"
                        (cardClick)="onCardClick($event)"></d-v2-discover>
                  </ng-container>
                  <ng-template #noDataTemplateCall>
                     <ng-container [ngTemplateOutlet]="noData"
                        [ngTemplateOutletContext]="{'iconName':'forum', 'noTextValue':'Coming Soon!'}"></ng-container>
                  </ng-template>
               </ng-template>

            </mat-tab>
            <mat-tab label="Your Communities">
               <ng-template mat-tab-label> <span class="nodtranslate">Your Communities</span> <span
                     class="ml-2 nodtranslate" *ngIf="userEnrollDetailsData?.length">({{ userEnrollDetailsData?.length
                     }})</span> </ng-template>
               <ng-template matTabContent>
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4"
                     *ngIf="userEnrollDetailsData?.length; else noEnrolledCommunity">
                     <div class="flex justify-center md:block" *ngFor="let item of userEnrollDetailsData">
                        <d-v2-community-card [community]="item" (click)="onCardClick(item)"></d-v2-community-card>
                     </div>


                  </div>

                  <ng-template #noEnrolledCommunity>
                     <ng-container [ngTemplateOutlet]="noData"
                        [ngTemplateOutletContext]="{'iconName':'forum', 'noTextValue':'Join a community to get started!'}"></ng-container>
                  </ng-template>
               </ng-template>
            </mat-tab>
         </mat-tab-group>

      </div>

      <!-- Column 3 -->
      <div class=" p-2 rounded-lg md:col-span-3">
         <d-v2-trending-discussions [expandCard]="true"></d-v2-trending-discussions>
      </div>
   </div>
</div>

<ng-template #noData let-iconName="iconName" let-noTextValue="noTextValue">
   <div class="mt-8">
      <d-v2-no-data [iconName]="iconName" [noText]="noTextValue"></d-v2-no-data>
   </div>
</ng-template>
