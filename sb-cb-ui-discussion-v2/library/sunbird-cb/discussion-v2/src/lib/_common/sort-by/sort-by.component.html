<mat-card class="sort-by-wrapper ">
    <mat-card-header>
        <mat-card-title class="card-title margin-bottom-s nodtranslate">Sort by</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <!-- <div class="body-title mb-2">sort</div> -->
        <div class="flex flex-row category-item">
            <mat-radio-group aria-label="Select an option">
                <ng-container *ngFor="let sort of sortData">
                    <mat-radio-button class="category-item cursor-pointer " [checked]="sort?.checked"
                        (change)="handleGetFilterType($event,sort,'timeDuration')" [value]="sort">
                        <span class="option-value nodtranslate">{{sort?.value}}</span></mat-radio-button>
                    <br>
                </ng-container>
            </mat-radio-group>
        </div>
    </mat-card-content>
</mat-card>
