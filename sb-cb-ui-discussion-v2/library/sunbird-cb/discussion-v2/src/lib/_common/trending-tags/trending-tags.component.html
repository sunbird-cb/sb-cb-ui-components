<mat-card class="trending-tags-wrapper mt-4">
  <mat-card-header>
    <mat-card-title><span class="nodtranslate">Trending Tags</span></mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-chip-listbox aria-label="Fish selection">
      <ng-container *ngFor="let tag of trendingTags">
        <mat-chip-option><span class="nodtranslate">{{tag}}</span></mat-chip-option>
      </ng-container>
    </mat-chip-listbox>
    <!-- <mat-chip-listbox class="custom-mdc-chip-listbox" aria-label="Fruit selection">
        <mat-chip *ngFor="let fruit of fruits" selectable [selected]="fruit?.selected">
          {{ fruit?.name }}
        </mat-chip>
      </mat-chip-listbox> -->
  </mat-card-content>
</mat-card>
